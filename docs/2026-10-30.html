<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://phoenix84-gr.github.io/phoenix-reader/2026-10-30.html">
</head>
<body>
<title>Phoenix Reader — 2026-10-30</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root{
    --bg:#e9ecea; --panel:#fbfcfb; --ink:#101619; --muted:#5c6a6d;
    --line:#d3dad7; --accent:#0f6b63; --rule:#101619;
    --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
    --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1315; --panel:#141c1e; --ink:#e4ebe9; --muted:#8ba0a1;
      --line:#233033; --accent:#5cc3b2; --rule:#3a4a4c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1315; --panel:#141c1e; --ink:#e4ebe9; --muted:#8ba0a1;
    --line:#233033; --accent:#5cc3b2; --rule:#3a4a4c;
  }
  body{background:var(--bg);color:var(--ink);margin:0;font-family:var(--serif);
    font-size:16px;line-height:1.55;}
  .wrap{max-width:760px;margin:0 auto;padding:40px 20px 72px;}
  header{border-bottom:2px solid var(--rule);padding-bottom:14px;}
  h1{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.22em;
    text-transform:uppercase;margin:0 0 10px;}
  .stamp{font-family:var(--mono);font-size:12px;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:6px 18px;font-variant-numeric:tabular-nums;}
  h2{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:var(--accent);margin:40px 0 0;
    padding-bottom:6px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:baseline;}
  h2 span{color:var(--muted);font-variant-numeric:tabular-nums;}
  .card{display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line);}
  .card img{width:104px;height:104px;object-fit:cover;flex:none;
    background:var(--panel);border:1px solid var(--line);}
  .body{min-width:0;flex:1;}
  .src{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);
    margin-bottom:5px;text-transform:uppercase;}
  .t{font-size:19px;font-weight:600;line-height:1.3;margin:0 0 7px;
    text-wrap:balance;}
  .t a{color:inherit;text-decoration:none;
    box-shadow:inset 0 -1px 0 0 var(--line);}
  .t a:hover{color:var(--accent);box-shadow:inset 0 -1px 0 0 var(--accent);}
  .sum{color:var(--muted);font-size:15px;margin:0 0 9px;white-space:pre-wrap;
    overflow-wrap:anywhere;max-width:62ch;}
  .note{font-family:var(--mono);font-size:12.5px;border-left:2px solid var(--accent);
    padding-left:10px;margin:0 0 9px;color:var(--ink);}
  .foot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;
    font-family:var(--mono);font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;}
  .foot a{color:var(--muted);text-decoration:none;overflow-wrap:anywhere;}
  .foot a:hover{color:var(--accent);}
  .warn{color:var(--accent);}
  footer{margin-top:40px;border-top:2px solid var(--rule);padding-top:12px;
    font-family:var(--mono);font-size:11.5px;color:var(--muted);}
  a:focus-visible,.t a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  @media (max-width:560px){
    .card{flex-direction:column;gap:12px;}
    .card img{width:100%;height:200px;}
  }
</style>

<div class="wrap">
<header>
<h1>Phoenix Reader — 2026-10-30</h1>
<div class="stamp">
<span>0 σύνδεσμοι</span>
<span>0 με πλήρη στοιχεία</span>
<span>χτίστηκε 2026-10-30 22:00:03 · μόλις τώρα</span>
</div>
</header>
<p class="sum">Κανένας σύνδεσμος σήμερα.</p>
<footer>παραδόθηκε 2026-10-30 22:00:04 · 0 πληρωμένες κλήσεις Apify · συλλογή από το Telegram, χωρίς χειροκίνητη επιλογή</footer>
</div>
</body>
</html>
